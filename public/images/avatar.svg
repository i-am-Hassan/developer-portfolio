<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="85%">
      <stop offset="0" stop-color="#0f2a2d"/>
      <stop offset="0.45" stop-color="#0a1316"/>
      <stop offset="1" stop-color="#05080a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ac8c"/>
      <stop offset="1" stop-color="#b5846a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d21"/>
      <stop offset="1" stop-color="#0b0f11"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2226"/>
      <stop offset="1" stop-color="#0a0d0f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="headClip">
      <ellipse cx="256" cy="222" rx="72" ry="88"/>
    </clipPath>
    <clipPath id="body">
      <path d="M52 512 C52 412 128 352 226 326 L286 326 C384 352 460 412 460 512 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="380" cy="150" r="130" fill="#2dd4bf" opacity="0.12" filter="url(#soft)"/>

  <!-- shoulders / dark clothing -->
  <path d="M52 512 C52 412 128 352 226 326 L286 326 C384 352 460 412 460 512 Z" fill="url(#shirt)"/>
  <g clip-path="url(#body)">
    <rect x="0" y="300" width="512" height="212" fill="url(#rim)"/>
    <path d="M460 512 C460 412 384 352 286 326" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- neck -->
  <path d="M226 270 L226 332 C226 350 286 350 286 332 L286 270 Z" fill="#b5846a"/>
  <path d="M226 300 C240 318 272 318 286 300 L286 280 L226 280 Z" fill="#000" opacity="0.22"/>

  <!-- crew neckline -->
  <path d="M214 330 C230 358 282 358 298 330" fill="none" stroke="#2a343a" stroke-width="5" stroke-linecap="round"/>

  <!-- ears -->
  <ellipse cx="184" cy="226" rx="9" ry="17" fill="#bf8f74"/>
  <ellipse cx="328" cy="226" rx="9" ry="17" fill="#a77a62"/>

  <!-- head -->
  <ellipse cx="256" cy="222" rx="72" ry="88" fill="url(#skin)"/>
  <g clip-path="url(#headClip)">
    <rect x="184" y="134" width="144" height="176" fill="url(#rim)"/>
    <ellipse cx="200" cy="250" rx="40" ry="70" fill="#000" opacity="0.12"/>
  </g>

  <!-- hair -->
  <path d="M182 214 C170 128 214 100 260 100 C306 100 346 128 330 214 C322 176 300 154 262 154 C222 154 196 176 182 214 Z" fill="url(#hair)"/>
  <path d="M236 108 C270 98 312 108 326 150" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- subtle beard shadow -->
  <path d="M190 236 C196 290 226 312 256 312 C286 312 316 290 322 236 C312 262 290 276 256 276 C222 276 200 262 190 236 Z" fill="#1a1411" opacity="0.35"/>

  <!-- brows -->
  <path d="M215 197 Q230 190 245 196" fill="none" stroke="#14100e" stroke-width="5" stroke-linecap="round"/>
  <path d="M267 196 Q282 190 297 197" fill="none" stroke="#14100e" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="230" cy="215" rx="6.5" ry="4.5" fill="#15110f"/>
  <ellipse cx="282" cy="215" rx="6.5" ry="4.5" fill="#15110f"/>
  <circle cx="232" cy="213.5" r="1.4" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="284" cy="213.5" r="1.4" fill="#2dd4bf" opacity="0.8"/>

  <!-- nose + mouth -->
  <path d="M256 220 L252 244 Q256 248 262 245" fill="none" stroke="#8d6450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M240 266 Q256 274 272 266" fill="none" stroke="#5a3b2e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- glasses -->
  <rect x="208" y="203" width="46" height="30" rx="10" fill="none" stroke="#0a0d0f" stroke-width="4"/>
  <rect x="258" y="203" width="46" height="30" rx="10" fill="none" stroke="#0a0d0f" stroke-width="4"/>
  <path d="M254 214 L258 214" stroke="#0a0d0f" stroke-width="4"/>
  <path d="M304 207 L200 207" stroke="none"/>
  <path d="M296 205 Q318 210 318 224" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6"/>
</svg>
